<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reviews for {{ game_title }}</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; padding: 40px; }
        h1 { color: #006400; text-align: center; }
        .review { background: white; padding: 15px; margin: 15px 0; border-radius: 8px; }
        .review h4 { margin: 0 0 5px; }
        .score { font-weight: bold; color: #28a745; }
        .back { text-align: center; margin-top: 30px; }
    </style>
</head>
<body>
    <h1>Reviews for {{ game_title }}</h1>
    <p class="back">
        <a href="/library">← Back to Library</a> | <a href="/dashboard">Back to Dashboard</a>
    </p>

    {% if reviews %}
        {% for r in reviews %}
        <div class="review">
            <h4>{{ r.username }} - Score: <span class="score">{{ r.score }}/10</span></h4>
            <p>"{{ r.review_text }}"</p>
            <p class="date">Posted on {{ r.created_at }}</p>
        </div>
        {% endfor %}
    {% else %}
        <p style="text-align: center;">No approved reviews yet for this game.</p>
    {% endif %}
</body>
</html>
